# CONFIGURACIÓN EJEMPLO DE BASE DE DATOS PARA SPRING BOOT
spring.datasource.url=jdbc:mysql://localhost:3306/aerolinea_db
spring.datasource.username=TU_USUARIO
spring.datasource.password=TU_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# CONFIGURACIÓN EJEMPLO DE MAILTRAP
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=TU_USUARIO_MAILTRAP
spring.mail.password=TU_PASSWORD_MAILTRAP

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# DIRECTORIO DE ARCHIVOS SUBIDOS
app.upload.dir=uploads